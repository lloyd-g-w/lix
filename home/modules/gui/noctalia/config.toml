# Noctalia (v5) config, linked to ~/.config/noctalia/config.toml.
# Changes made in Noctalia's settings GUI go to
# ~/.local/state/noctalia/settings.toml and override this file; copy them
# here and delete that file to keep this the source of truth.
# Check with: noctalia config validate ./config.toml

[bar]
order = ["main"]

[bar.main]
margin_ends = 0
panel_overlap = 0
radius = 0
start = ["clock", "spacer_2", "taskbar"]
center = ["workspaces"]

[widget.launcher.actions]
# Use vicinae instead of Noctalia's own launcher
left = "exec vicinae toggle"

[widget.clock]
format = "%-I:%M:%S %p %-d/%-m/%Y"

[widget.spacer_2]
type = "spacer"

[widget.taskbar]
group_single_icon_per_app = true

[widget.brightness]
enabled = false

[widget.clipboard]
enabled = false

[widget.workspaces]
# Hyprland workspaces are named 1..10 per monitor (see hyprland.lua)
label_source = "name"

[dock]
enabled = false

[calendar]
enabled = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false

[shell]
font_family = "JetBrainsMono Nerd Font Mono"
# Password prompts for apps that need admin rights (no other agent runs)
polkit_agent = true

[shell.panel]
control_center_placement = "floating"
open_near_click_control_center = true

[shell.screenshot]
# Super+Shift+S runs `noctalia msg screenshot-region` in every compositor;
# it saves here and copies to the clipboard.
annotate = true
directory = "@SCREENSHOT_DIR@"

[wallpaper]
enabled = true

[wallpaper.default]
path = "@WALLPAPER@" # home/modules/gui/background.jpg

[theme]
mode = "dark"
source = "custom"
custom_palette = "lix" # palettes/lix.json

[theme.templates]
builtin_ids = ["hyprland", "kitty"]
